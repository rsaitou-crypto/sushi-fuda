<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}*{box-sizing:border-box}</style>
</head>
<body>
<title>おすし札引き</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: 1画面アプリ。中央に木札（縦書き＋ネタの絵）、下に「札を引く」ボタン、その下に今日食べたもの */
:root{
  --bg:#eef0ec;
  --panel:#ffffff;
  --ink:#1d2320;
  --muted:#6a716c;
  --wood:#e6cfa3;
  --wood-edge:#b8925a;
  --wood-ink:#20160c;
  --accent:#1f5f4a;
  --accent-ink:#ffffff;
  --line:#d5d9d3;
  --c-aka:#b8322a; --c-shiro:#6d8fa8; --c-hikari:#4f6b78; --c-kai:#a67a3a;
  --c-ebi:#d86a3c; --c-gunkan:#2e4a3a; --c-maki:#3b3b3b; --c-kawari:#8a5aa8; --c-side:#4d7a3a; --c-fun:#c98a1e;
  --f-brush:"Yuji Syuku","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --panel:#1d2421; --ink:#e9ece8; --muted:#9aa39d; --line:#2f3934;
  --wood:#d9bf8e; --wood-edge:#9c7845; --accent:#4fae8c; --accent-ink:#0d1512; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141917; --panel:#1d2421; --ink:#e9ece8; --muted:#9aa39d; --line:#2f3934;
  --wood:#d9bf8e; --wood-edge:#9c7845; --accent:#4fae8c; --accent-ink:#0d1512; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.app{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-block:14px 32px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-family:var(--f-brush);font-size:26px;margin:0;font-weight:400;letter-spacing:.06em}
.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;
  padding:8px 14px;font:inherit;font-size:13px;cursor:pointer}
.iconbtn:focus-visible,.draw:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* 木札 */
.stage{display:flex;justify-content:center;min-height:380px;align-items:center}
.fuda{width:170px;height:364px;position:relative;transition:transform .22s ease-in-out}
.fuda.shrink{transform:scaleX(0)}
.fuda.flip .back,.fuda:not(.flip) .front{display:none}
.face{position:absolute;inset:0;border-radius:6px;
  background:
    repeating-linear-gradient(90deg,rgba(120,80,30,.07) 0 2px,transparent 2px 9px),
    linear-gradient(180deg,var(--wood),color-mix(in srgb,var(--wood) 85%,var(--wood-edge)));
  border:2px solid var(--wood-edge);box-shadow:0 10px 24px rgba(0,0,0,.18);
  display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 0 14px;color:var(--wood-ink)}
.face::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--wood-edge);opacity:.7;flex:none}
.back{justify-content:center}
.back .mark{font-family:var(--f-brush);font-size:44px;writing-mode:vertical-rl;letter-spacing:.2em;margin-top:-18px}
.front .namebox{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.front .name{font-family:var(--f-brush);writing-mode:vertical-rl;-webkit-writing-mode:vertical-rl;font-size:38px;line-height:1.2;letter-spacing:.06em;
  white-space:nowrap;padding:0 4px}
.front .name.long{font-size:31px}
.front .name.xlong{font-size:25px}
.front .art{width:136px;height:91px;flex:none;display:flex;align-items:center;justify-content:center}
.front .art svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 1px rgba(60,30,0,.18))}
.front .cat{font-size:11px;font-weight:700;color:#fff;padding:3px 8px;border-radius:3px;letter-spacing:.08em;flex:none}

.result{text-align:center;min-height:44px;display:flex;flex-direction:column;gap:2px}
.result .big{font-size:17px;font-weight:700}
.result .sub{font-size:13px;color:var(--muted)}

.draw{width:100%;border:0;border-radius:14px;padding:18px;font-family:var(--f-brush);font-size:24px;
  background:var(--accent);color:var(--accent-ink);cursor:pointer;letter-spacing:.15em;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.draw:active{transform:translateY(2px);box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.draw:disabled{opacity:.5}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.panel h2{font-size:13px;margin:0;color:var(--muted);font-weight:700;letter-spacing:.08em;display:flex;justify-content:space-between}
.hist{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none;font-variant-numeric:tabular-nums}
.hist li{display:flex;align-items:center;gap:10px}
.hist .n{color:var(--muted);width:2.8em;font-size:12px}
.hist .dot{width:8px;height:8px;border-radius:2px;flex:none}
.empty{color:var(--muted);font-size:13px}
.linkbtn{background:none;border:0;color:var(--muted);font:inherit;font-size:12px;text-decoration:underline;cursor:pointer}

/* 設定シート */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet-in{background:var(--panel);width:100%;max-width:480px;border-radius:16px 16px 0 0;max-height:85%;overflow:auto;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:16px}
.sheet h3{margin:0;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer;display:flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.chip .dot{width:8px;height:8px;border-radius:2px}
.note{font-size:12px;color:var(--muted);margin:0}
.items{font-size:12px;color:var(--muted);line-height:1.7}
.front .name.xxlong{font-size:21px}
.front .rar{font-size:11px;font-weight:700;color:#5a3a00;background:linear-gradient(135deg,#f6dd8a,#d9a92e);padding:2px 8px;border-radius:3px;letter-spacing:.1em;flex:none}
.front .rar.r3{color:#fff;background:linear-gradient(135deg,#c0392b,#e0a020)}
.sec{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.switch{width:52px;height:30px;border-radius:999px;border:0;background:var(--line);position:relative;cursor:pointer;flex:none;padding:0}
.switch span{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"] span{left:25px}
.switch:focus-visible,select:focus-visible,input:focus-visible,.addbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
details summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:700;padding:4px 0}
details[open]{display:flex;flex-direction:column;gap:10px}
.rarlist{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;font-size:14px}
.rarlist .nm{display:flex;align-items:center;gap:8px;min-width:0}
select,input[type=text]{font:inherit;font-size:16px;padding:8px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.rarlist select{width:auto;font-size:14px;padding:5px 8px}
.addform{display:flex;gap:12px;align-items:flex-start}
.addform .preview{width:96px;height:64px;flex:none;border-radius:6px;background:var(--wood);border:1.5px solid var(--wood-edge);padding:4px}
.addform .preview svg{width:100%;height:100%;display:block}
.fields{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.fields label,.lbl{font-size:12px;color:var(--muted);font-weight:700}
.fields label:not(:first-child){margin-top:6px}
.fieldset{display:flex;flex-direction:column;gap:6px}
.swatch{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--panel) inset}
.addbtn{border:1.5px solid var(--accent);background:transparent;color:var(--accent);border-radius:10px;padding:12px;font:inherit;font-weight:700;cursor:pointer}
.err{color:var(--c-aka)}
.err.ok{color:var(--accent)}
.del{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer;margin-left:auto}
.del.confirm{border-color:var(--c-aka);color:var(--c-aka)}
@media (prefers-reduced-motion:reduce){.fuda{transition:none}}
</style>

<div class="app">
  <header>
    <h1>おすし札引き</h1>
    <button class="iconbtn" id="openSettings">札の設定</button>
  </header>

  <div class="stage">
    <div class="fuda" id="fuda" aria-live="polite">
      <div class="face back"><div class="mark">御品書</div></div>
      <div class="face front"><div class="namebox"><div class="name" id="fName">中トロ</div></div><div class="art" id="fArt"></div><div class="rar" id="fRar" hidden></div><div class="cat" id="fCat">赤身</div></div>
    </div>
  </div>

  <div class="result" id="result"></div>

  <button class="draw" id="draw">札を引く</button>
  <p class="note" id="left" style="text-align:center;margin-top:-8px"></p>

  <section class="panel">
    <h2><span>今日食べたもの <span id="count"></span></span><button class="linkbtn" id="reset">リセット</button></h2>
    <div class="chips" id="resetBox" hidden style="justify-content:flex-end">
      <span class="note" style="align-self:center">記録を消して山札を戻しますか？</span>
      <button class="chip" id="resetNo">やめる</button>
      <button class="chip" id="resetYes" aria-pressed="true">戻す</button>
    </div>
    <ul class="hist" id="hist"></ul>
  </section>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-in" role="dialog" aria-label="札の設定">
    <section class="sec">
      <h3>札に入れるジャンル</h3>
      <div class="chips" id="cats"></div>
      <p class="note" id="poolInfo"></p>
      <div class="items" id="items"></div>
    </section>

    <section class="sec">
      <div class="row">
        <h3>レア度</h3>
        <button class="switch" id="rarOn" role="switch" aria-checked="false"><span></span></button>
      </div>
      <p class="note">オンにすると、大トロやうには出にくく、がりやお茶は出やすくなります。オフのときはどの札も同じ確率です。</p>
      <details id="rarDetails">
        <summary>札ごとのレア度を変える</summary>
        <p class="note">出やすさの目安：よく出る＝ふつうの約1.7倍、レア＝半分、激レア＝6分の1</p>
        <div class="rarlist" id="rarList"></div>
        <button class="linkbtn" id="rarReset">レア度を最初の設定に戻す</button>
      </details>
    </section>

    <section class="sec">
      <h3>ネタを追加する</h3>
      <div class="addform">
        <div class="preview" id="addPreview"></div>
        <div class="fields">
          <label for="newName">ネタの名前（8文字まで）</label>
          <input id="newName" type="text" maxlength="8" placeholder="例：のどぐろ" autocomplete="off">
          <label for="newCat">ジャンル</label>
          <select id="newCat"></select>
          <label for="newRar">レア度</label>
          <select id="newRar"></select>
        </div>
      </div>
      <div class="fieldset"><span class="lbl">絵の形</span><div class="chips" id="newShape"></div></div>
      <div class="fieldset"><span class="lbl">色</span><div class="chips" id="newColor"></div></div>
      <p class="note err" id="addMsg" aria-live="polite"></p>
      <button class="addbtn" id="addBtn">この札を追加する</button>
      <div id="customBox" hidden>
        <h3 style="margin-top:6px">追加したネタ</h3>
        <ul class="hist" id="customList"></ul>
      </div>
    </section>

    <button class="draw" id="closeSettings" style="font-size:18px;padding:14px">閉じる</button>
  </div>
</div>

<script>
/* ===== 絵（SVG）を描く部品 ===== */
let uid=0;
const svg = s => `<svg viewBox="0 0 120 80" aria-hidden="true">${s}</svg>`;
const NORI="#1f2b24", RICE_C="#fbf8ef";
const GRAINS=[[28,60],[44,63],[62,61],[80,63],[92,57],[36,52],[70,54],[54,57]];
const RICE = `<rect x="16" y="40" width="88" height="29" rx="13" fill="${RICE_C}" stroke="#cfc6ae" stroke-width="1.5"/><g fill="#e6dfcc">${GRAINS.map(([x,y])=>`<ellipse cx="${x}" cy="${y}" rx="3" ry="1.6"/>`).join("")}</g>`;
const NETA = "M10 44 C10 30 30 24 60 24 C92 24 112 30 110 44 C108 51 94 53 60 53 C26 53 12 51 10 44 Z";

function nigiri(o){
  const id="c"+(uid++);
  let s=RICE+`<defs><clipPath id="${id}"><path d="${NETA}"/></clipPath></defs><path d="${NETA}" fill="${o.c}"/><g clip-path="url(#${id})">`;
  if(o.sheen) s+=`<rect x="0" y="20" width="120" height="16" fill="${o.sheen}"/><rect x="0" y="34" width="120" height="3" fill="#eef3f6" opacity=".85"/>`;
  if(o.zebra) for(let i=0;i<7;i++) s+=`<path d="M${14+i*14} 22 q5 8 0 16" stroke="${o.zebra}" stroke-width="3" fill="none"/>`;
  if(o.edge) s+=`<rect x="0" y="20" width="120" height="7" fill="${o.edge}"/>`;
  if(o.tip) s+=`<rect x="88" y="20" width="32" height="40" fill="${o.tip}"/>`;
  if(o.layers) for(let i=0;i<3;i++) s+=`<rect x="0" y="${31+i*7}" width="120" height="1.4" fill="#e0a920"/>`;
  if(o.stripes) for(let i=0;i<o.stripes;i++){const x=16+i*(84/o.stripes);s+=`<path d="M${x} 24 L${x+14} 54" stroke="#fff" stroke-opacity=".55" stroke-width="2.2"/>`}
  if(o.score) for(let i=0;i<6;i++) s+=`<path d="M${24+i*14} 26 l-6 26" stroke="#d6d1c7" stroke-width="1.3"/>`;
  if(o.spots) for(const [x,y] of [[24,32],[40,30],[58,33],[76,30],[92,34],[32,40],[66,40],[86,42]]) s+=`<circle cx="${x}" cy="${y}" r="1.7" fill="${o.spots}"/>`;
  if(o.suckers){ s+=`<rect x="0" y="40" width="120" height="16" fill="${o.suckers}"/>`; for(let i=0;i<6;i++) s+=`<circle cx="${22+i*15}" cy="47" r="3" fill="#f3d7d2" stroke="${o.suckers}"/>`;}
  if(o.aburi) for(const [x,y,r] of [[30,32,7],[56,30,9],[84,34,7],[70,42,5]]) s+=`<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r*.6}" fill="#5a2a10" opacity=".38"/>`;
  if(o.glaze) s+=`<rect x="0" y="20" width="120" height="40" fill="#3a1a08" opacity=".22"/><path d="M24 31 Q60 25 96 31" stroke="#fff" stroke-opacity=".55" stroke-width="2" fill="none"/>`;
  s+=`</g><path d="${NETA}" fill="none" stroke="rgba(0,0,0,.22)" stroke-width="1.2"/>`;
  if(o.top) s+=o.top;
  if(o.band) s+=`<rect x="52" y="21" width="16" height="49" rx="2" fill="${NORI}"/>`;
  if(o.mayo) s+=`<path d="M24 36 l7 -5 l7 5 l7 -5 l7 5 l7 -5 l7 5 l7 -5 l7 5 l7 -5" stroke="#fff6d8" stroke-width="2.4" fill="none" stroke-linejoin="round"/>`;
  return svg(s);
}
const GARNISH = `<circle cx="60" cy="31" r="5.5" fill="#efdfae"/><circle cx="57" cy="29" r="2" fill="#5f9e45"/><circle cx="62" cy="30" r="1.6" fill="#5f9e45"/>`;

function shrimp(c,band,big){
  const id="c"+(uid++), y=big?-3:0;
  const body=`M8 ${41+y} C8 ${28+y} 28 ${23+y} 52 ${25+y} C76 ${27+y} 92 ${29+y} 96 ${38+y} C92 ${49+y} 72 ${54-y} 52 ${54-y} C28 ${54-y} 8 ${51-y} 8 ${41+y} Z`;
  let s=RICE+`<defs><clipPath id="${id}"><path d="${body}"/></clipPath></defs>`+
    `<path d="M93 39 L115 25 L110 40 L115 55 Z" fill="#d8371f" stroke="#a8240f" stroke-width="1"/>`+
    `<path d="${body}" fill="${c}"/><g clip-path="url(#${id})">`;
  for(let i=0;i<6;i++) s+=`<rect x="${16+i*13}" y="10" width="5" height="60" fill="${band}" opacity=".75"/>`;
  return svg(s+`</g><path d="${body}" fill="none" stroke="rgba(0,0,0,.2)" stroke-width="1.2"/>`);
}

function gunkan(top){
  return svg(`<rect x="22" y="32" width="76" height="38" rx="5" fill="${NORI}"/><rect x="22" y="45" width="76" height="1.6" fill="#344a3d"/><rect x="22" y="58" width="76" height="1.6" fill="#344a3d"/>`+top);
}
const mound = c => `<path d="M24 35 C26 13 94 13 96 35 Z" fill="${c}" stroke="rgba(0,0,0,.18)"/>`;
const sprinkle = (pts,fn) => pts.map(fn).join("");
const MPTS=[[36,30],[46,24],[58,21],[70,23],[82,28],[52,31],[66,30],[40,32],[76,32],[60,27],[88,32],[32,33]];
const G = {
  ikura: gunkan(sprinkle([[30,32],[40,32],[50,32],[60,32],[70,32],[80,32],[90,32],[35,24],[45,23],[55,22],[65,22],[75,23],[85,24],[50,15],[62,15],[72,17]],
    ([x,y])=>`<circle cx="${x}" cy="${y}" r="5.4" fill="#f2581c" stroke="#bf3a0a" stroke-width=".8"/><circle cx="${x-1.8}" cy="${y-1.8}" r="1.5" fill="#fff" opacity=".85"/>`)),
  uni: gunkan(sprinkle([[30,30],[40,26],[50,24],[60,23],[70,24],[80,26],[90,30],[36,33],[48,32],[60,31],[72,32],[84,33]],
    ([x,y])=>`<ellipse cx="${x}" cy="${y}" rx="7.5" ry="5" fill="#f3a43a" stroke="#d07e18" stroke-width=".8"/>`)),
  negitoro: gunkan(mound("#f0a0a8")+sprinkle(MPTS,([x,y])=>`<circle cx="${x}" cy="${y}" r="2" fill="#4f9a3c"/>`)),
  kanimiso: gunkan(mound("#9a7a3a")+sprinkle(MPTS.slice(0,6),([x,y])=>`<ellipse cx="${x}" cy="${y}" rx="3" ry="1.5" fill="#c3a25e"/>`)),
  shirasu: gunkan(mound("#f4f1e8")+sprinkle(MPTS,([x,y],i)=>`<path d="M${x-5} ${y} q5 -${2+i%3} 10 0" stroke="#b7b1a2" stroke-width="1.2" fill="none"/><circle cx="${x+5}" cy="${y}" r=".9" fill="#333"/>`)),
  tunamayo: gunkan(mound("#efe0bd")+sprinkle(MPTS,([x,y])=>`<ellipse cx="${x}" cy="${y}" rx="2.6" ry="1.4" fill="#d6c294"/>`)),
  corn: gunkan(mound("#f6ecc8")+sprinkle(MPTS.concat([[44,17],[56,15],[68,16],[78,20]]),([x,y])=>`<circle cx="${x}" cy="${y}" r="3.2" fill="#f2c230" stroke="#d29e12" stroke-width=".6"/>`)),
  natto: gunkan(mound("#8a6a3a")+sprinkle(MPTS,([x,y])=>`<ellipse cx="${x}" cy="${y}" rx="3.6" ry="2.6" fill="#c49a5a" stroke="#6b4e24" stroke-width=".8"/>`)+`<path d="M40 22 q20 -8 40 4" stroke="#f3ecd8" stroke-width="1" fill="none" opacity=".8"/>`),
};

function maki(inner){
  const p=(cx,cy)=>`<circle cx="${cx}" cy="${cy}" r="22" fill="${NORI}"/><circle cx="${cx}" cy="${cy}" r="18.5" fill="${RICE_C}"/>${sprinkle([[-10,-6],[8,-10],[11,7],[-8,10]],([dx,dy])=>`<ellipse cx="${cx+dx}" cy="${cy+dy}" rx="2.6" ry="1.4" fill="#e6dfcc"/>`)}${inner(cx,cy)}`;
  return svg(p(38,44)+p(82,48));
}
const MAKI = {
  tekka: maki((x,y)=>`<rect x="${x-7}" y="${y-7}" width="14" height="14" rx="2" fill="#b8202a"/>`),
  kappa: maki((x,y)=>`<circle cx="${x}" cy="${y}" r="7.5" fill="#4f8a32"/><circle cx="${x}" cy="${y}" r="4.5" fill="#d4ebb0"/>`),

/* ===== アプリ本体 ===== */
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let enabled = store.get("sushi.cats", Object.keys(CATS));
if(!enabled.includes("fun") && !store.get("sushi.funSeen",false)) enabled.push("fun");
store.set("sushi.funSeen",true);
let custom = store.get("sushi.custom", []);          // [{name,cat,shape,color,rar}]
let rarOn = store.get("sushi.rarOn", false);
let rarOverride = store.get("sushi.rarity", {});     // {name: level}

let CARDS = [];
function buildCards(){
  CARDS = BASE.concat(custom.map(c=>({name:c.name,cat:c.cat,custom:true,art:()=>SHAPES[c.shape].art(c.color)})));
}
buildCards();
let history = store.get("sushi.hist", []).filter(h=>CARDS.some(c=>c.name===h.name));

const $ = id=>document.getElementById(id);
const byName = n => CARDS.find(c=>c.name===n);
const rarityOf = c => rarOverride[c.name] ?? (c.custom ? (custom.find(x=>x.name===c.name)?.rar ?? 1) : (DEFAULT_RARITY[c.name] ?? 1));
const pool = ()=>CARDS.filter(c=>enabled.includes(c.cat));
const remaining = ()=>pool().filter(c=>!history.some(h=>h.name===c.name));
const IDLE='<div class="big">札を引いてください</div><div class="sub">引いた札のネタだけ食べられます。同じ札は二度出ません</div>';
let busy=false;
const reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

function pick(list){
  if(!rarOn) return list[Math.floor(Math.random()*list.length)];
  const ws=list.map(c=>RARITY[rarityOf(c)].w), total=ws.reduce((a,b)=>a+b,0);
  let r=Math.random()*total;
  for(let i=0;i<list.length;i++){ r-=ws[i]; if(r<0) return list[i]; }
  return list[list.length-1];
}

function renderLeft(){
  const r=remaining().length, d=$("draw");
  $("left").textContent=`山札の残り ${r} 枚`+(rarOn?"・レア度オン":"");
  if(busy) return;
  if(!pool().length){d.disabled=true;d.textContent="札を引く"}
  else if(!r){d.disabled=false;d.textContent="山札を戻す"}
  else{d.disabled=false;d.textContent=history.length?"もう一枚引く":"札を引く"}
}

function renderHist(){
  const h=$("hist"); h.innerHTML="";
  $("count").textContent = history.length? `（${history.length}枚）`:"";
  if(!history.length){h.innerHTML='<li class="empty">まだ何も引いていません</li>';return}
  [...history].reverse().forEach((c,i)=>{
    const li=document.createElement("li");
    li.innerHTML=`<span class="n">${history.length-i}枚目</span><span class="dot" style="background:${CATS[c.cat].color}"></span><span>${esc(c.name)}</span>`;
    h.appendChild(li);
  });
}

function showCard(card){
  const n=$("fName"); n.textContent=card.name;
  const L=card.name.length;
  n.className="name"+(L>=8?" xxlong":L>=6?" xlong":L>=5?" long":"");
  $("fArt").innerHTML=card.art();
  $("fCat").textContent=CATS[card.cat].label; $("fCat").style.background=CATS[card.cat].color;
  const lv=rarityOf(card), r=$("fRar");
  r.hidden = !(rarOn && lv>=2);
  r.textContent = lv===3?"★激レア★":"レア";
  r.className="rar"+(lv===3?" r3":"");
}

function draw(){
  if(busy||!pool().length) return;
  const p=remaining();
  if(!p.length){ resetAll(); return; }
  busy=true; $("draw").disabled=true;
  const card=pick(p);
  const f=$("fuda");
  f.classList.add("shrink");
  setTimeout(()=>{
    showCard(card);
    f.classList.add("flip");
    f.classList.remove("shrink");
    setTimeout(()=>{
      history.push({name:card.name,cat:card.cat}); store.set("sushi.hist",history); renderHist();
      const lv=rarityOf(card), tag = rarOn&&lv===3?"激レア！":rarOn&&lv===2?"レア！":"";
      $("result").innerHTML = card.cat==="fun"
        ? `<div class="big">${tag}お楽しみ札「${esc(card.name)}」</div><div class="sub">${card.desc}</div>`
        : `<div class="big">${tag}「${esc(card.name)}」を注文！</div><div class="sub">${CATS[card.cat].label}の札</div>`;
      if(!remaining().length) $("result").innerHTML+=`<div class="sub">これで山札は終わりです</div>`;
      busy=false; renderLeft();
    },240);
  },reduced?0:240);
}

/* --- 設定：ジャンル --- */
function renderCats(){
  const box=$("cats"); box.innerHTML="";
  Object.entries(CATS).forEach(([k,v])=>{
    const b=document.createElement("button");
    b.className="chip"; b.id="cat-"+k; b.setAttribute("aria-pressed",enabled.includes(k));
    b.innerHTML=`<span class="dot" style="background:${v.color}"></span>${v.label}`;
    b.onclick=()=>{enabled=enabled.includes(k)?enabled.filter(x=>x!==k):[...enabled,k];store.set("sushi.cats",enabled);renderSettings()};
    box.appendChild(b);
  });
  const p=pool();
  $("poolInfo").textContent = p.length? `札は全部で ${p.length} 枚、残り ${remaining().length} 枚です`:"ジャンルを1つ以上選んでください";
  $("items").textContent = p.map(c=>c.name).join("・");
}

/* --- 設定：レア度 --- */
const rarOptions = sel => RARITY.map((r,i)=>`<option value="${i}"${i===sel?" selected":""}>${r.label}</option>`).join("");
function renderRarity(){
  $("rarOn").setAttribute("aria-checked",rarOn);
  const box=$("rarList"); box.innerHTML="";
  CARDS.forEach((c,i)=>{
    const nm=document.createElement("div"); nm.className="nm";
    nm.innerHTML=`<span class="dot" style="width:8px;height:8px;border-radius:2px;flex:none;background:${CATS[c.cat].color}"></span><span>${esc(c.name)}</span>`;
    const s=document.createElement("select"); s.id="rar-"+i; s.setAttribute("aria-label",c.name+"のレア度");
    s.innerHTML=rarOptions(rarityOf(c));
    s.onchange=()=>{rarOverride[c.name]=+s.value;store.set("sushi.rarity",rarOverride)};
    box.append(nm,s);
  });
}
$("rarOn").onclick=()=>{rarOn=!rarOn;store.set("sushi.rarOn",rarOn);renderRarity();renderLeft()};
$("rarReset").onclick=()=>{rarOverride={};store.set("sushi.rarity",rarOverride);renderRarity()};

/* --- 設定：ネタの追加 --- */
let addShape="nigiri", addColor=SWATCHES[0];
function renderAddForm(){
  const sh=$("newShape"); sh.innerHTML="";
  Object.entries(SHAPES).forEach(([k,v])=>{
    const b=document.createElement("button"); b.className="chip"; b.id="shape-"+k; b.textContent=v.label;
    b.setAttribute("aria-pressed",k===addShape);
    b.onclick=()=>{addShape=k;renderAddForm()};
    sh.appendChild(b);
  });
  const co=$("newColor"); co.innerHTML="";
  SWATCHES.forEach((c,i)=>{
    const b=document.createElement("button"); b.className="swatch"; b.id="color-"+i; b.style.background=c;
    b.setAttribute("aria-label","色"+(i+1)); b.setAttribute("aria-pressed",c===addColor);
    b.onclick=()=>{addColor=c;renderAddForm()};
    co.appendChild(b);
  });
  $("addPreview").innerHTML=SHAPES[addShape].art(addColor);
}
// ジャンル・レア度の選択は再描画で消えないよう、初回だけ作る
function initAddForm(){
  $("newCat").innerHTML=Object.entries(CATS).filter(([k])=>k!=="fun").map(([k,v])=>`<option value="${k}">${v.label}</option>`).join("");
  $("newRar").innerHTML=rarOptions(1);
  renderAddForm();
}
$("addBtn").onclick=()=>{
  const name=$("newName").value.trim(), msg=$("addMsg");
  msg.className="note err";
  if(!name){msg.textContent="ネタの名前を入れてください";return}
  if(CARDS.some(c=>c.name===name)){msg.textContent=`「${name}」はもうあります。別の名前にしてください`;return}
  const item={name,cat:$("newCat").value,shape:addShape,color:addColor,rar:+$("newRar").value};
  custom.push(item); store.set("sushi.custom",custom);
  if(!enabled.includes(item.cat)){enabled.push(item.cat);store.set("sushi.cats",enabled)}
  buildCards();
  $("newName").value="";
  msg.className="note err ok"; msg.textContent=`「${name}」を山札に追加しました`;
  renderSettings();
};
function renderCustom(){
  $("customBox").hidden=!custom.length;
  const ul=$("customList"); ul.innerHTML="";
  custom.forEach((c,i)=>{
    const li=document.createElement("li");
    li.innerHTML=`<span class="dot" style="background:${CATS[c.cat].color}"></span><span>${esc(c.name)}</span><span class="note">${CATS[c.cat].label}</span>`;
    const b=document.createElement("button"); b.className="del"; b.id="del-"+i; b.textContent="削除";
    b.onclick=()=>{
      if(!b.classList.contains("confirm")){b.classList.add("confirm");b.textContent="本当に削除";return}
      custom=custom.filter(x=>x.name!==c.name); store.set("sushi.custom",custom);
      delete rarOverride[c.name]; store.set("sushi.rarity",rarOverride);
      buildCards(); renderSettings();
    };
    li.appendChild(b); ul.appendChild(li);
  });
}

function renderSettings(){ renderCats(); renderRarity(); renderCustom(); renderLeft(); }

function resetAll(){
  history=[];store.set("sushi.hist",history);renderHist();$("fuda").classList.remove("flip");
  $("result").innerHTML=IDLE; $("resetBox").hidden=true; renderLeft();
}
$("draw").onclick=draw;
$("reset").onclick=()=>{ if(history.length) $("resetBox").hidden=false; };
$("resetNo").onclick=()=>{$("resetBox").hidden=true};
$("resetYes").onclick=resetAll;
$("openSettings").onclick=()=>{renderSettings();$("addMsg").textContent="";$("sheet").hidden=false};
$("closeSettings").onclick=()=>{$("sheet").hidden=true};
$("sheet").onclick=e=>{if(e.target.id==="sheet")$("sheet").hidden=true};

// 起動時：最後に引いた札があれば表向きで表示
$("result").innerHTML=IDLE;
if(history.length){
  const last=byName(history[history.length-1].name);
  showCard(last); $("fuda").classList.add("flip");
  $("result").innerHTML=`<div class="big">前回の続きから</div><div class="sub">最後に引いたのは「${esc(last.name)}」</div>`;
}
initAddForm();
renderHist(); renderSettings();
</script>
</body>
